<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
        body{
             background: linear-gradient(90deg,rgba(13, 1, 1, 1) 26%, rgba(77, 0, 9, 1) 70%, rgba(125, 39, 5, 1) 92%, rgba(163, 99, 20, 1) 100%);
        }
        *{
            margin: 0;
            padding: 0;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 20px;

            div{
                outline: 3px solid rgb(153, 19, 158);
            } 
        }

        .navbar{
            grid-column: 1/11;
            height: 10vh;
            overflow: hidden;

            img{
                margin-top: -60rem;
            }
        }

        .image{
            grid-column: 1/5;
            height: 80vh;
        }

        .text{
            grid-column: 5/11;
            height: 80vh;
        }

        .footer{
            grid-column: 1/11;
            height: 10vh;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="navbar">
            <img src="6210615.jpg" alt="">
        </div>
        <div class="image">
        </div>
        <div class="text">
        </div>
        <div class="footer">
            <!-- <div></div>
            <div></div>
            <div></div> -->
        </div>
    </div>
</body>

</html>
